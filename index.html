<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoloVape Shop</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 15px; margin: 0; }
        
        /* Заставка */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #121212; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.8s ease;
        }
        .splash-logo { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; background: #222; }
        .splash-name { color: #d4af37; font-size: 24px; font-weight: bold; letter-spacing: 2px; }

        /* Шапка */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #1a1a1a; padding: 10px 14px; border-radius: 16px; border: 1px solid #2a2a2a; }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand-logo { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #333; }
        .brand-name { font-size: 16px; font-weight: 600; color: #fff; letter-spacing: 0.5px; }

        .top-controls { display: flex; gap: 8px; align-items: center; }
        .btn-ctrl { background: #262626; color: #fff; border: 1px solid #333; padding: 6px 12px; border-radius: 14px; cursor: pointer; font-size: 13px; }
        .btn-cart { background: #007bff; border-color: #007bff; font-weight: 500; }
        
        /* Поиск */
        .search-box { width: 100%; padding: 12px 15px; background: #1e1e1e; border: 1px solid #333; border-radius: 14px; color: #fff; font-size: 15px; margin-bottom: 15px; box-sizing: border-box; outline: none; }
        .search-box:focus { border-color: #007bff; }

        /* Категории */
        .categories-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; }
        .categories-scroll::-webkit-scrollbar { display: none; }
        .cat-btn { background: #1e1e1e; color: #aaa; border: 1px solid #333; padding: 10px 18px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-size: 14px; transition: 0.2s; }
        .cat-btn.active { background: #007bff; color: #fff; border-color: #007bff; }

        /* Карточка товара */
        .product-card { background: #1a1a1a; border: 1px solid #2a2a2a; padding: 12px; border-radius: 16px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; transition: 0.2s; }
        .product-left { display: flex; align-items: center; gap: 12px; flex: 1; }
        .product-img { width: 55px; height: 55px; border-radius: 12px; object-fit: cover; background: #333; }
        .product-info h3 { font-size: 15px; margin: 0 0 4px 0; color: #fff; font-weight: 500; }
        .product-info p { font-size: 13px; margin: 0; color: #888; }
        
        .product-right { display: flex; align-items: center; gap: 10px; }
        .status-badge { font-size: 12px; padding: 4px 8px; border-radius: 8px; white-space: nowrap; }
        .status-green { background: rgba(40, 167, 69, 0.15); color: #28a745; }
        .status-yellow { background: rgba(255, 193, 7, 0.15); color: #ffc107; }

        .action-btns { display: flex; gap: 6px; align-items: center; }
        .icon-btn { background: #262626; border: 1px solid #333; color: #fff; width: 36px; height: 36px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: 0.2s; }
        .icon-btn:active { background: #333; }
        .btn-plus { background: #007bff; border-color: #007bff; color: #fff; font-weight: bold; font-size: 16px; }

        /* Модальное окно корзины */
        #cart-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: flex-end; z-index: 10000;
        }
        .cart-content {
            background: #1a1a1a; width: 100%; max-height: 80vh; border-radius: 24px 24px 0 0;
            padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; border-top: 1px solid #333;
        }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 18px; font-weight: bold; }
        .cart-items-list { overflow-y: auto; max-height: 40vh; margin-bottom: 15px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; background: #222; padding: 10px 12px; border-radius: 12px; margin-bottom: 8px; }
        .cart-total { font-size: 16px; font-weight: bold; margin-bottom: 15px; display: flex; justify-content: space-between; border-top: 1px solid #333; padding-top: 12px; }
        .btn-checkout { background: #28a745; color: #fff; border: none; width: 100%; padding: 14px; border-radius: 14px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; }
        .btn-close-cart { background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer; }

        .no-results { text-align: center; color: #666; padding: 30px; font-size: 14px; }
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 10px; font-size: 14px; display: none; z-index: 20000; border: 1px solid #444; }
    </style>
</head>
<body>

    <!-- Заставка -->
    <div id="splash-screen">
        <img src="logo.png.jpg" class="splash-logo" alt="Logo">
        <div class="splash-name">SOLOVAPE</div>
    </div>

    <!-- Шапка -->
    <header>
        <div class="brand">
            <img src="logo.png.jpg" class="brand-logo" alt="Logo">
            <span class="brand-name">SOLOVAPE</span>
        </div>
        <div class="top-controls">
            <button class="btn-ctrl btn-cart" onclick="toggleCart()">🛒 <span id="cart-count">0</span></button>
            <button class="btn-ctrl" onclick="toggleLang()" id="lang-toggle">🌐 RU</button>
        </div>
    </header>

    <!-- Поиск -->
    <input type="text" id="search-input" class="search-box" placeholder="Поиск по названию..." oninput="render()">

    <!-- Категории -->
    <div class="categories-scroll" id="categories-bar"></div>

    <!-- Счетчик товаров -->
    <p id="counter" style="color: #888; font-size: 13px; margin: 0 0 15px 5px;"></p>

    <!-- Каталог -->
    <div id="catalog"></div>

    <!-- Окно корзины -->
    <div id="cart-modal">
        <div class="cart-content">
            <div class="cart-header">
                <span id="cart-title-text">Корзина</span>
                <button class="btn-close-cart" onclick="toggleCart()">✕</button>
            </div>
            <div class="cart-items-list" id="cart-items-container"></div>
            <div class="cart-total">
                <span id="total-text-label">Итого:</span>
                <span id="cart-total-price">0 €</span>
            </div>
            <button class="btn-checkout" onclick="checkoutTelegram()">Оформить заказ в Telegram</button>
        </div>
    </div>

    <div id="toast">Добавлено в корзину!</div>

    <script>
        window.onload = () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => { splash.style.display = 'none'; }, 800);
            }, 2000);
        };

        let currentLang = 'ru';
        let currentCategory = 'all';
        let productData = {};
        let cart = [];

        fetch('products.json')
            .then(res => res.json())
            .then(data => {
                productData = data;
                render();
            });

        function toggleLang() {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            document.getElementById('lang-toggle').innerText = currentLang === 'ru' ? '🌐 RU' : '🌐 EN';
            document.getElementById('search-input').placeholder = currentLang === 'ru' ? 'Поиск по названию...' : 'Search products...';
            document.getElementById('cart-title-text').innerText = currentLang === 'ru' ? 'Корзина' : 'Cart';
            document.getElementById('total-text-label').innerText = currentLang === 'ru' ? 'Итого:' : 'Total:';
            render();
            updateCartUI();
        }

        function selectCategory(catName) {
            currentCategory = catName;
            render();
        }

        function render() {
            const searchQuery = document.getElementById('search-input').value.toLowerCase();
            const catBar = document.getElementById('categories-bar');
            catBar.innerHTML = '';

            let allText = currentLang === 'ru' ? 'Все категории' : 'All categories';
            catBar.innerHTML += `<button class="cat-btn ${currentCategory === 'all' ? 'active' : ''}" onclick="selectCategory('all')">${allText}</button>`;

            let totalProducts = 0;

            if (productData.categories) {
                productData.categories.forEach(cat => {
                    totalProducts += cat.items.length;
                    const cName = currentLang === 'ru' ? cat.name_ru : cat.name_en;
                    const isActive = currentCategory === cat.name_ru ? 'active' : '';
                    catBar.innerHTML += `<button class="cat-btn ${isActive}" onclick="selectCategory('${cat.name_ru}')">${cName}</button>`;
                });
            }

            document.getElementById('counter').innerText = currentLang === 'ru' ? `${totalProducts} товаров` : `${totalProducts} items`;

            const catalog = document.getElementById('catalog');
            catalog.innerHTML = '';

            let displayedCount = 0;

            if (productData.categories) {
                productData.categories.forEach(cat => {
                    if (currentCategory !== 'all' && currentCategory !== cat.name_ru) return;

                    cat.items.forEach(item => {
                        const title = currentLang === 'ru' ? item.title_ru : item.title_en;
                        
                        if (searchQuery && !title.toLowerCase().includes(searchQuery)) {
                            return;
                        }

                        displayedCount++;
                        const catTitle = currentLang === 'ru' ? cat.name_ru : cat.name_en;
                        const imgSrc = item.image ? item.image : 'https://images.unsplash.com/photo-1523275335684-37898b6baf30';

                        let stockHtml = '';
                        if (item.stock > 3) {
                            let text = currentLang === 'ru' ? 'В наличии' : 'In stock';
                            stockHtml = `<span class="status-badge status-green">${text}</span>`;
                        } else {
                            let text = currentLang === 'ru' ? `Осталось: ${item.stock}` : `Left: ${item.stock}`;
                            stockHtml = `<span class="status-badge status-yellow">${text}</span>`;
                        }

                        catalog.innerHTML += `
                            <div class="product-card">
                                <div class="product-left">
                                    <img src="${imgSrc}" class="product-img" alt="">
                                    <div class="product-info">
                                        <h3>${title}</h3>
                                        <p>${catTitle} · ${item.price}</p>
                                    </div>
                                </div>
                                <div class="product-right">
                                    ${stockHtml}
                                    <div class="action-btns">
                                        <button class="icon-btn" onclick="copyTitle('${title}')" title="Копировать">📋</button>
                                        <button class="icon-btn btn-plus" onclick='addToCart(${JSON.stringify(title)}, ${JSON.stringify(item.price)})' title="В корзину">+</button>
                                    </div>
                                </div>
                            </div>`;
                    });
                });
            }

            if (displayedCount === 0) {
                catalog.innerHTML = `<div class="no-results">${currentLang === 'ru' ? 'Ничего не найдено 😔' : 'Nothing found 😔'}</div>`;
            }
        }

        function addToCart(title, price) {
            cart.push({ title, price });
            updateCartUI();
            showToast(currentLang === 'ru' ? 'Добавлено в корзину!' : 'Added to cart!');
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            const container = document.getElementById('cart-items-container');
            container.innerHTML = '';

            if (cart.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:#666; padding:20px;">${currentLang === 'ru' ? 'Корзина пуста' : 'Cart is empty'}</div>`;
                document.getElementById('cart-total-price').innerText = '0';
                return;
            }

            let totalPrice = 0;
            cart.forEach((item, index) => {
                // Извлекаем число из строки цены (например, "15 €" -> 15)
                const numericPrice = parseFloat(item.price.replace(/[^0-9.]/g, '')) || 0;
                totalPrice += numericPrice;

                container.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <div style="font-size:14px; font-weight:500;">${item.title}</div>
                            <div style="font-size:12px; color:#888;">${item.price}</div>
                        </div>
                        <button class="icon-btn" style="background:#333; width:30px; height:30px;" onclick="removeFromCart(${index})">✕</button>
                    </div>`;
            });

            document.getElementById('cart-total-price').innerText = totalPrice + ' €';
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function checkoutTelegram() {
            if (cart.length === 0) return;
            
            let message = currentLang === 'ru' ? 'Привет, хочу оформить заказ:\n' : 'Hi, I want to place an order:\n';
            cart.forEach((item, i) => {
                message += `${i + 1}. ${item.title} — ${item.price}\n`;
            });
            message += `\n${currentLang === 'ru' ? 'Итого' : 'Total'}: ${document.getElementById('cart-total-price').innerText}`;

            const tgLink = `https://t.me/Solo_Vape34?text=${encodeURIComponent(message)}`;
            window.open(tgLink, '_blank');
        }

        function copyTitle(title) {
            navigator.clipboard.writeText(title).then(() => {
                showToast(currentLang === 'ru' ? 'Скопировано!' : 'Copied!');
            });
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.innerText = text;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 1500);
        }
    </script>
</body>
</html>
