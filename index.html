<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SoloVape Shop</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: sans-serif; padding: 15px; margin: 0; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #1a1a1a; border-radius: 16px; margin-bottom: 15px; }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand-logo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .product-card { background: #1a1a1a; border: 1px solid #2a2a2a; padding: 12px; border-radius: 16px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        .product-left { display: flex; align-items: center; gap: 10px; }
        .product-img { width: 50px; height: 50px; border-radius: 10px; object-fit: cover; }
        .icon-btn { background: #262626; border: 1px solid #333; color: #fff; width: 35px; height: 35px; border-radius: 10px; cursor: pointer; margin-left: 5px; }
    </style>
</head>
<body>
    <header>
        <div class="brand"><img src="logo.png.jpg" class="brand-logo"><span style="font-weight:600;">SOLOVAPE</span></div>
    </header>
    <div id="catalog"></div>
    <script>
        fetch('products.json').then(res => res.json()).then(data => {
            const catalog = document.getElementById('catalog');
            data.categories?.forEach(cat => {
                cat.items.forEach(item => {
                    catalog.innerHTML += `
                        <div class="product-card">
                            <div class="product-left">
                                <img src="${item.image}" class="product-img">
                                <div><h3 style="margin:0; font-size:14px;">${item.title_ru}</h3><p style="margin:0; font-size:12px; color:#888;">${item.price}</p></div>
                            </div>
                            <div>
                                <button class="icon-btn" onclick="navigator.clipboard.writeText('${item.title_ru}')">📋</button>
                                <button class="icon-btn" style="background:#007bff;" onclick="window.open('https://t.me/Solo_Vape34?text=Хочу заказать: ${item.title_ru}')">›</button>
                            </div>
                        </div>`;
                });
            });
        });
    </script>
</body>
</html>
