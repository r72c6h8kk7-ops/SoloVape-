<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoloVape Shop</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 15px; margin: 0; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-size: 24px; margin: 0; }
        .top-controls { display: flex; gap: 10px; }
        .btn-ctrl { background: #1e1e1e; color: #fff; border: 1px solid #333; padding: 8px 12px; border-radius: 20px; cursor: pointer; font-size: 14px; }
        
        /* Кнопки категорий (горизонтальная прокрутка) */
        .categories-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: none; }
        .categories-scroll::-webkit-scrollbar { display: none; }
        .cat-btn { background: #1e1e1e; color: #aaa; border: 1px solid #333; padding: 10px 18px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-size: 14px; transition: 0.2s; }
        .cat-btn.active { background: #007bff; color: #fff; border-color: #007bff; }

        /* Карточка товара как на примере */
        .product-card { background: #1a1a1a; border: 1px solid #2a2a2a; padding: 12px; border-radius: 16px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: 0.2s; }
        .product-card:active { background: #222; }
        .product-left { display: flex; align-items: center; gap: 12px; }
        .product-img { width: 55px; height: 55px; border-radius: 12px; object-fit: cover; background: #333; }
        .product-info h3 { font-size: 15px; margin: 0 0 4px 0; color: #fff; font-weight: 500; }
        .product-info p { font-size: 13px; margin: 0; color: #888; }
        .product-right { display: flex; align-items: center; gap: 8px; color: #888; font-size: 14px; }
        .arrow { font-size: 18px; color: #666; }
    </style>
</head>
<body>

    <header>
        <div>
            <h1 id="main-title">Каталог</h1>
            <p id="counter" style="color: #888; font-size: 13px; margin: 4px 0 0 0;"></p>
        </div>
        <div class="top-controls">
            <button class="btn-ctrl" onclick="toggleLang()" id="lang-toggle">🌐 RU</button>
        </div>
    </header>

    <!-- Горизонтальные кнопки категорий -->
    <div class="categories-scroll" id="categories-bar"></div>

    <!-- Список товаров -->
    <div id="catalog"></div>

    <script>
        let currentLang = 'ru';
        let currentCategory = 'all';
        let productData = {};

        fetch('products.json')
            .then(res => res.json())
            .then(data => {
                productData = data;
                render();
            });

        function toggleLang() {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            document.getElementById('lang-toggle').innerText = currentLang === 'ru' ? '🌐 RU' : '🌐 EN';
            render();
        }

        function selectCategory(catName) {
            currentCategory = catName;
            render();
        }

        function render() {
            // Заголовки
            document.getElementById('main-title').innerText = currentLang === 'ru' ? 'Каталог' : 'Catalog';

            const catBar = document.getElementById('categories-bar');
            catBar.innerHTML = '';

            // Кнопка "Все категории"
            let allTextRu = 'Все категории';
            let allTextEn = 'All categories';
            catBar.innerHTML += `<button class="cat-btn ${currentCategory === 'all' ? 'active' : ''}" onclick="selectCategory('all')">${currentLang === 'ru' ? allTextRu : allTextEn}</button>`;

            let totalProducts = 0;

            // Рендер кнопок категорий
            productData.categories.forEach(cat => {
                totalProducts += cat.items.length;
                const cName = currentLang === 'ru' ? cat.name_ru : cat.name_en;
                const isActive = currentCategory === cat.name_ru ? 'active' : '';
                catBar.innerHTML += `<button class="cat-btn ${isActive}" onclick="selectCategory('${cat.name_ru}')">${cName}</button>`;
            });

            document.getElementById('counter').innerText = currentLang === 'ru' ? `${totalProducts} товаров` : `${totalProducts} items`;

            // Рендер товаров
            const catalog = document.getElementById('catalog');
            catalog.innerHTML = '';

            productData.categories.forEach(cat => {
                if (currentCategory !== 'all' && currentCategory !== cat.name_ru) return;

                cat.items.forEach(item => {
                    const title = currentLang === 'ru' ? item.title_ru : item.title_en;
                    const catTitle = currentLang === 'ru' ? cat.name_ru : cat.name_en;
                    // Картинка (если не указана, ставим стандартную затычку)
                    const imgSrc = item.image ? item.image : 'https://images.unsplash.com/photo-1523275335684-37898b6baf30';

                    catalog.innerHTML += `
                        <div class="product-card" onclick="order('${title}')">
                            <div class="product-left">
                                <img src="${imgSrc}" class="product-img" alt="">
                                <div class="product-info">
                                    <h3>${title}</h3>
                                    <p>${catTitle} · ${item.price}</p>
                                </div>
                            </div>
                            <div class="product-right">
                                <span>${item.stock} шт.</span>
                                <span class="arrow">›</span>
                            </div>
                        </div>`;
                });
            });
        }

        function order(title) {
            const text = currentLang === 'ru' ? `Привет, хочу заказать: ${title}` : `Hi, I want to order: ${title}`;
            const tgLink = `https://t.me/Solo_Vape34?text=${encodeURIComponent(text)}`;
            window.open(tgLink, '_blank');
        }
    </script>
</body>
</html>
