<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoloVape Shop</title>
    <style>
        #splash-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.8s ease; }
        .splash-logo { width: 120px; height: 120px; margin-bottom: 15px; }
        .splash-name { color: #d4af37; font-size: 24px; font-weight: bold; letter-spacing: 2px; }
        body { background-color: #121212; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 15px; margin: 0; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #1a1a1a; padding: 10px 14px; border-radius: 16px; border: 1px solid #2a2a2a; }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand-logo { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
        .brand-name { font-size: 16px; font-weight: 600; color: #fff; }
        .top-controls { display: flex; gap: 8px; }
        .btn-ctrl { background: #262626; color: #fff; border: 1px solid #333; padding: 6px 12px; border-radius: 14px; cursor: pointer; }
        .search-box { width: 100%; padding: 12px 15px; background: #1e1e1e; border: 1px solid #333; border-radius: 14px; color: #fff; margin-bottom: 15px; box-sizing: border-box; }
        .product-card { background: #1a1a1a; border: 1px solid #2a2a2a; padding: 12px; border-radius: 16px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
        .product-left { display: flex; align-items: center; gap: 12px; flex: 1; }
        .product-img { width: 55px; height: 55px; border-radius: 12px; object-fit: cover; }
        .action-btns { display: flex; gap: 6px; }
        .icon-btn { background: #262626; border: 1px solid #333; color: #fff; width: 36px; height: 36px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 10px; display: none; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="logo.png" class="splash-logo" alt="Logo">
        <div class="splash-name">SOLOVAPE</div>
    </div>

    <header>
        <div class="brand">
            <img src="logo.png" class="brand-logo" alt="Logo">
            <span class="brand-name">SOLOVAPE</span>
        </div>
        <button class="btn-ctrl" onclick="toggleLang()" id="lang-toggle">🌐 RU</button>
    </header>

    <input type="text" id="search-input" class="search-box" placeholder="Поиск..." oninput="render()">
    <div id="catalog"></div>
    <div id="toast">Скопировано!</div>

    <script>
        window.onload = () => { setTimeout(() => { document.getElementById('splash-screen').style.opacity = '0'; setTimeout(() => { document.getElementById('splash-screen').style.display = 'none'; }, 800); }, 2000); };
        
        let currentLang = 'ru';
        let productData = {};

        fetch('products.json').then(res => res.json()).then(data => { productData = data; render(); });

        function render() {
            const catalog = document.getElementById('catalog');
            catalog.innerHTML = '';
            productData.categories?.forEach(cat => {
                cat.items.forEach(item => {
                    const title = currentLang === 'ru' ? item.title_ru : item.title_en;
                    catalog.innerHTML += `
                        <div class="product-card">
                            <div class="product-left">
                                <img src="${item.image || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30'}" class="product-img">
                                <div><h3>${title}</h3></div>
                            </div>
                            <div class="action-btns">
                                <button class="icon-btn" onclick="copyTitle('${title}')">📋</button>
                                <button class="icon-btn" onclick="order('${title}')" style="background:#007bff; border-color:#007bff;"> › </button>
                            </div>
                        </div>`;
                });
            });
        }
        function copyTitle(title) { navigator.clipboard.writeText(title); const t = document.getElementById('toast'); t.style.display='block'; setTimeout(()=>t.style.display='none', 1500); }
        function order(title) { window.open(`https://t.me/Solo_Vape34?text=${encodeURIComponent('Хочу заказать: ' + title)}`, '_blank'); }
    </script>
</body>
</html>
